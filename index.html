 {id:'c8',city:'cz',cat:'yusheng',day:'',name:'官塘原味鱼生（潮州总店）',score:'85',lat:23.6645,lng:116.6410,
  addr:'潮州市湘桥区绿榕北路8号门市',time:'11:00-14:00 / 16:30-次日02:00',price:'人均¥122',
  dish:'石坚鱼生、明虾生',
  desc:'盖得潮州榜TOP8，与成发鱼生二选一，仅大人尝试。'},
 {id:'c9',city:'cz',cat:'jingcai',day:'',name:'郑厨私房菜',score:'84',lat:23.6600,lng:116.6400,
  addr:'潮州市湘桥区古城西侧片区',time:'需预订',price:'人均¥366',
  dish:'精致潮州菜、时令海鲜',
  desc:'盖得潮州榜TOP9，安静吃顿好饭的备选。'}
];

const CAT = {niurou:{c:'#8b1e1e',n:'潮汕牛肉火锅',e:'🥩',z:'牛'},
             yemi:{c:'#d9822b',n:'夜糜/白粥',e:'🥣',z:'粥'},
             lue:{c:'#b8562e',n:'卤鹅',e:'🦢',z:'鹅'},
             guozhi:{c:'#5d7a3a',n:'粿汁/粿条',e:'🍜',z:'粿'},
             yusheng:{c:'#4a5f8a',n:'鱼生/生腌',e:'🍣',z:'鱼'},
             jingcai:{c:'#7b4b94',n:'精致潮菜',e:'🍷',z:'菜'},
             hotel:{c:'#2b7ac9',n:'酒店',e:'🏨',z:'⌂'}};
const DAYS = [
 {id:'d1',name:'D1·10.1 抵达·牛肉火锅',color:'#e74c3c',pts:['h1','s1']},
 {id:'d2',name:'D2·10.2 老城扫街·夜糜',color:'#e67e22',pts:['s6','s7','s5','s2']},
 {id:'d3',name:'D3·10.3 本地人路线',color:'#c9a227',pts:['s5','s3','s4']},
 {id:'d4',name:'D4·10.4 转场潮州',color:'#16a085',pts:['h1','c1','h2','c2']},
 {id:'d5',name:'D5·10.5 古城全家日',color:'#2980b9',pts:['h2','c6','c5','c4']},
 {id:'d6',name:'D6·10.6 返程早餐',color:'#8e44ad',pts:['h2','c3']}];

const IDX = Object.fromEntries(P.map(p=>[p.id,p]));
let currentFilter='all', selectedId=null, showRoutes=false, needGcj=true;
let markers=[], routeLines=[], baseLayer=null;

/* ============ 坐标纠偏 WGS-84 → GCJ-02 ============ */
function wgs2gcj(lat,lng){
  const a=6378245.0, ee=0.00669342162296594323;
  const tlat=(x,y)=>{let r=-100+2*x+3*y+.2*y*y+.1*x*y+.2*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(y*Math.PI)+40*Math.sin(y/3*Math.PI))*2/3;
    r+=(160*Math.sin(y/12*Math.PI)+320*Math.sin(y*Math.PI/30))*2/3; return r;};
  const tlng=(x,y)=>{let r=300+x+2*y+.1*x*x+.1*x*y+.1*Math.sqrt(Math.abs(x));
    r+=(20*Math.sin(6*x*Math.PI)+20*Math.sin(2*x*Math.PI))*2/3;
    r+=(20*Math.sin(x*Math.PI)+40*Math.sin(x/3*Math.PI))*2/3;
    r+=(150*Math.sin(x/12*Math.PI)+300*Math.sin(x/30*Math.PI))*2/3; return r;};
  let dLat=tlat(lat-105,lng-105), dLng=tlng(lat-105,lng-105);
  const rad=lat/180*Math.PI; let magic=Math.sin(rad); magic=1-ee*magic*magic;
  const sq=Math.sqrt(magic);
  dLat=(dLat*180)/((a*(1-ee))/(magic*sq)*Math.PI);
  dLng=(dLng*180)/(a/sq*Math.cos(rad)*Math.PI);
  return [lat+dLat,lng+dLng];
}
const cur = p => { const g = needGcj? wgs2gcj(p.lat,p.lng) : [p.lat,p.lng]; return L.latLng(g[0],g[1]); };

/* ============ 地图初始化 ============ */
const map = L.map('map',{zoomControl:true}).setView([23.5,116.7],10);
L.control.scale({imperial:false}).addTo(map);

// 使用更稳定、支持 HTTPS 的高德底图瓦片
const BASES = {
  amap: ()=>L.tileLayer('https://wprd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scl=1&style=7&x={x}&y={y}&z={z}',
                        {subdomains:['1','2','3','4'],attribution:'© 高德地图',maxZoom:18}),
  sat:  ()=>L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                        {attribution:'© Esri',maxZoom:18}),
  carto:()=>L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
                        {subdomains:'abcd',attribution:'© OSM © CARTO',maxZoom:19})};

function setBase(m){
  needGcj = (m==='amap');
  if(baseLayer) map.removeLayer(baseLayer);
  baseLayer = BASES[m]().addTo(map);
  ['amap','sat','carto'].forEach(k=>document.getElementById('bm-'+k).classList.toggle('active',k===m));
  refresh(false);
}
const allBounds = ()=>L.latLngBounds(visible().map(p=>cur(p)));

/* ============ 标记 ============ */
function icon(p){
  const c=CAT[p.cat].c, s=selectedId===p.id, size=s?46:36;
  const html=`<div class="pin ${p.cat==='hotel'?'hotel':''} ${s?'sel':''}">
    <div class="head" style="width:${size}px;height:${size}px;background:${c};font-size:${s?16:13}px">
    <span>${CAT[p.cat].z}</span></div></div>`;
  return L.divIcon({html,className:'',iconSize:[size,size+6],iconAnchor:[size/2,size]});
}
const visible = ()=>P.filter(p=>currentFilter==='all'||p.city===currentFilter);

function buildMarkers(){
  markers.forEach(m=>map.removeLayer(m)); markers=[];
  visible().forEach(p=>{
    const m=L.marker(cur(p),{icon:icon(p),riseOnHover:true}).addTo(map);
    m.bindPopup(`<div class="pop-t">${CAT[p.cat].e} ${p.name}</div>
      <div class="pop-s">${CAT[p.cat].n}${p.score?' · 评分 '+p.score:''}</div>`);
    m.on('click',()=>select(p.id,true));
    p._m=m; markers.push(m);
  });
}

/* ============ 逐日路线 ============ */
function drawRoutes(){
  routeLines.forEach(l=>map.removeLayer(l)); routeLines=[];
  if(!showRoutes) return;
  DAYS.forEach(d=>{
    const pts=d.pts.map(id=>IDX[id]).filter(p=>currentFilter==='all'||p.city===currentFilter);
    if(pts.length<2) return;
    const line=L.polyline(pts.map(p=>cur(p)),{color:d.color,weight:3.5,opacity:.75,
      className:'route'}).addTo(map);
    routeLines.push(line);
  });
}

/* ============ UI ============ */
function refresh(fly){
  buildMarkers(); drawRoutes(); renderList();
  if(fly) map.flyToBounds(allBounds(),{padding:[45,45],duration:.8});
}
function setFilter(f){
  currentFilter=f;
  ['all','st','cz'].forEach(k=>document.getElementById('btn-'+k).classList.toggle('active',k===f));
  refresh(true);
  document.getElementById('panel').innerHTML='<div class="empty">👆 点击地图上的标记，或从下方卡片选择</div>';
}
function toggleRoutes(){
  showRoutes=!showRoutes;
  document.getElementById('btn-route').classList.toggle('active',showRoutes);
  drawRoutes();
}

function renderList(){
  const box=document.getElementById('list'); box.innerHTML='';
  visible().forEach(p=>{
    const d=document.createElement('div');
    d.className='chip'+(selectedId===p.id?' sel':'');
    d.style.setProperty('--c',CAT[p.cat].c);
    d.onclick=()=>select(p.id,true);
    const dayInfo=p.day?DAYS.find(x=>x.id===p.day):null;
    d.innerHTML=`<span class="dot" style="background:${CAT[p.cat].c}"></span>
      ${dayInfo?`<span class="day" style="background:${dayInfo.color}">${dayInfo.id.toUpperCase()}</span>`:''}
      ${p.name}<span class="score">${p.score||''}</span>`;
    box.appendChild(d);
  });
}

function select(id,fly){
  selectedId=id; const p=IDX[id];
  buildMarkers(); renderList();
  if(fly&&p._m){ map.flyTo(cur(p),Math.max(map.getZoom(),15),{duration:.6});
    setTimeout(()=>p._m.openPopup(),650); }
  const g=cur(p);
  const nav=`https://uri.amap.com/marker?position=${g.lng.toFixed(6)},${g.lat.toFixed(6)}&name=${encodeURIComponent(p.name)}`;
  document.getElementById('panel').innerHTML=`
    <h2>${CAT[p.cat].e} ${p.name}
      <span class="tag ${p.cat==='hotel'?'hotel':'hot'}">${CAT[p.cat].n}</span>
      ${p.score?`<span class="tag">盖得评分 ${p.score}</span>`:''}</h2>
    <div class="row"><b>📍 地址：</b>${p.addr}</div>
    <div class="row"><b>🕐 时间：</b>${p.time}${p.price?` ｜ <b>💰</b> ${p.price}`:''}</div>
    <div class="row"><b>🍽 必点：</b>${p.dish}</div>
    <div class="desc">${p.desc}</div>
    <div class="btns">
      <a href="${nav}" target="_blank">🧭 高德导航</a>
      <button class="gray" onclick="navigator.clipboard.writeText('${p.addr.replace(/'/g,'')}').then(()=>this.textContent='✓ 已复制')">📋 复制地址</button>
    </div>`;
}

/* ============ 图例 & 统计 ============ */
document.getElementById('legend-cat').innerHTML =
  Object.values(CAT).map(c=>`<span><i style="background:${c.c}"></i>${c.n}</span>`).join('');
document.getElementById('legend-days').innerHTML =
  DAYS.map(d=>`<span><span class="ln" style="border-color:${d.color}"></span>${d.name}</span>`).join('');
const nSt=P.filter(p=>p.city==='st').length, nCz=P.filter(p=>p.city==='cz').length;
document.getElementById('stats').innerHTML=
  `<span>🌊 汕头 <b>${nSt}</b> 处</span><span>🏯 潮州 <b>${nCz}</b> 处</span>
   <span>🏨 酒店 <b>2</b> 家</span><span>📅 <b>6</b> 天动线</span>`;

/* 启动与加载失败提示 */
if (typeof L === 'undefined') {
  document.getElementById('map').innerHTML = '<div style="padding:20px;text-align:center;color:#c0392b;font-size:14px;line-height:1.6;">⚠️ 地图组件加载失败<br>请检查手机网络，或尝试切换浏览器</div>';
} else {
  setBase('amap');
  map.fitBounds(allBounds(),{padding:[45,45]});
}
</script>

<!-- ===== 添加地点插件（自定义收藏功能） ===== -->
<script>
(function(){
  const KEY='csmap_custom_v1';
  const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}};
  const save=a=>localStorage.setItem(KEY,JSON.stringify(a));
  const customs=load();
  customs.forEach(c=>{if(!P.some(x=>x.id===c.id))P.push(c);});

  const st=document.createElement('style');st.textContent=`
    .fab{position:fixed;right:14px;bottom:80px;z-index:1400;width:52px;height:52px;border-radius:50%;
      border:none;background:linear-gradient(135deg,#c0392b,#8b1e1e);color:#fff;font-size:26px;
      box-shadow:0 6px 16px rgba(139,30,30,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;}
    .fab:active{transform:scale(.92)}
    .pickbar{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:1400;
      background:rgba(44,42,38,.92);color:#fff;padding:9px 18px;border-radius:20px;font-size:13px;
      box-shadow:0 4px 14px rgba(0,0,0,.3);display:none;backdrop-filter:blur(8px);}
    .pickbar button{margin-left:10px;background:none;border:none;color:#ffb199;font-size:13px;}
    .mask{position:fixed;inset:0;z-index:1500;background:rgba(30,25,18,.45);display:none;
      align-items:center;justify-content:center;padding:18px;backdrop-filter:blur(3px);}
    .mask.show{display:flex}
    .sheet{background:#fff;border-radius:16px;max-width:420px;width:100%;max-height:86vh;overflow:auto;padding:20px;}
    .sheet h3{font-size:17px;color:#6d1616;margin-bottom:8px;}
    .sheet label{display:block;font-size:12px;color:#8a7f6e;margin:10px 0 4px;}
    .sheet input,.sheet select,.sheet textarea{width:100%;border:1px solid #e3dbc9;border-radius:9px;
      padding:9px 11px;font-size:14px;background:#fbf8f2;box-sizing:border-box;}
    .sheet textarea{min-height:64px;resize:vertical}
    .sheet .ops{display:flex;gap:10px;margin-top:14px;}
    .sheet .ops button{flex:1;padding:10px;border:none;border-radius:10px;font-size:14px;cursor:pointer;}
    .btn-ok{background:linear-gradient(135deg,#8b1e1e,#a83232);color:#fff}
    .btn-cancel{background:#eee7d9;color:#5a5347}
    .mi{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px dashed #eee2cf;font-size:13px;}
    .mi b{flex:1}
    .mi button{border:none;background:#ffe8e0;color:#c0392b;border-radius:8px;padding:5px 10px;font-size:12px;}
    .hint{font-size:11.5px;color:#a49a8a;line-height:1.6;margin-top:8px;}
  `;document.head.appendChild(st);

  document.body.insertAdjacentHTML('beforeend',`
    <button class="fab" id="fabAdd" title="添加地点">＋</button>
    <div class="pickbar" id="pickbar">👇 请在地图上点选位置<button id="pickCancel">取消</button></div>
    <div class="mask" id="formMask"><div class="sheet" id="formSheet"></div></div>
    <div class="mask" id="mgrMask"><div class="sheet" id="mgrSheet"></div></div>`);

  let picking=false,lastTap=0;
  const fab=document.getElementById('fabAdd'),pickbar=document.getElementById('pickbar');
  const formMask=document.getElementById('formMask'),mgrMask=document.getElementById('mgrMask');

  const guessCity=(lat,lng)=>{
    const dST=Math.pow(lat-23.36,2)+Math.pow(lng-116.70,2);
    const dCZ=Math.pow(lat-23.66,2)+Math.pow(lng-116.65,2);
    return dCZ<dST?'cz':'st';
  };
  function gcj2wgs(lat,lng){ let w=[lat,lng];
    for(let i=0;i<3;i++){ const g=wgs2gcj(w[0],w[1]); w=[lat-(g[0]-lat),lng-(g[1]-lng)]; }
    return w; }

  map.on('click',e=>{
    if(!picking)return;
    picking=false;pickbar.style.display='none';
    let lat=e.latlng.lat,lng=e.latlng.lng;
    if(needGcj){const w=gcj2wgs(lat,lng);lat=w[0];lng=w[1];}
    openForm(lat,lng);
  });

  function startPick(){picking=true;pickbar.style.display='block';}
  fab.onclick=startPick;
  document.getElementById('pickCancel').onclick=()=>{picking=false;pickbar.style.display='none';};
  fab.addEventListener('touchend',()=>{const n=Date.now();if(n-lastTap<350)openMgr();lastTap=n;});

  function openForm(lat,lng){
    const city=guessCity(lat,lng);
    document.getElementById('formSheet').innerHTML=`
      <h3>➕ 添加地点</h3>
      <div class="hint">已选位置：${lat.toFixed(5)}, ${lng.toFixed(5)}</div>
      <label>名称 *</label><input id="fName" placeholder="如：老妈宫粽球">
      <label>类型</label><select id="fCat">${Object.entries(CAT).map(([k,v])=>`<option value="${k}">${v.e} ${v.n}</option>`).join('')}</select>
      <label>城市</label><select id="fCity"><option value="st" ${city==='st'?'selected':''}>汕头</option><option value="cz" ${city==='cz'?'selected':''}>潮州</option></select>
      <label>地址</label><input id="fAddr" placeholder="选填">
      <label>营业时间</label><input id="fTime" placeholder="选填，如 10:00-22:00">
      <label>人均</label><input id="fPrice" placeholder="选填，如 ¥60">
      <label>必点 / 备注</label><textarea id="fDish" placeholder="选填"></textarea>
      <div class="ops"><button class="btn-cancel" id="fCancel">取消</button><button class="btn-ok" id="fSave">保存</button></div>`;
    formMask.classList.add('show');
    document.getElementById('fCancel').onclick=()=>formMask.classList.remove('show');
    document.getElementById('fSave').onclick=()=>{
      const name=document.getElementById('fName').value.trim();
      if(!name){document.getElementById('fName').focus();return;}
      const item={id:'u'+Date.now(),custom:true,city:document.getElementById('fCity').value,
        cat:document.getElementById('fCat').value,name,lat,lng,
        addr:document.getElementById('fAddr').value.trim()||'（地图点选位置）',
        time:document.getElementById('fTime').value.trim()||'—',
        price:document.getElementById('fPrice').value.trim(),
        dish:document.getElementById('fDish').value.trim()||'—',
        desc:'自定义收藏的地点。'};
      P.push(item);customs.push(item);save(customs);
      formMask.classList.remove('show');
      refresh(false);
      select(item.id,false);
      if(item._m){map.flyTo(cur(item),15,{duration:.6});setTimeout(()=>item._m&&item._m.openPopup(),650);}
    };
  }

  function openMgr(){
    picking=false;pickbar.style.display='none';
    const list=customs.map(c=>`<div class="mi"><span style="width:10px;height:10px;border-radius:50%;background:${CAT[c.cat].c};flex-shrink:0"></span><b>${c.name}</b><button data-id="${c.id}">删除</button></div>`).join('')||'<div class="hint">暂无自定义地点</div>';
    document.getElementById('mgrSheet').innerHTML=`
      <h3>🗂 我添加的地点</h3>${list}
      <label style="margin-top:14px">备份 / 迁移（复制发给家人，对方粘贴后点导入）</label>
      <textarea id="mgrJson" placeholder="导出内容显示在这里">${customs.length?JSON.stringify(customs):''}</textarea>
      <div class="ops"><button class="btn-cancel" id="mgrCopy">复制全部</button><button class="btn-ok" id="mgrImport">导入</button></div>
      <div class="ops"><button class="btn-cancel" id="mgrClear">清空自定义地点</button></div>
      <div class="hint">数据保存在当前浏览器里。换手机或换浏览器时，用"复制全部→导入"迁移。</div>
      <div class="ops"><button class="btn-cancel" id="mgrClose">关闭</button></div>`;
    mgrMask.classList.add('show');
    document.querySelectorAll('#mgrSheet .mi button').forEach(b=>b.onclick=()=>{
      const id=b.dataset.id,i=customs.findIndex(c=>c.id===id);
      if(i>-1){customs.splice(i,1);save(customs);
        const pi=P.findIndex(x=>x.id===id);if(pi>-1)P.splice(pi,1);
        if(selectedId===id){selectedId=null;document.getElementById('panel').innerHTML='<div class="empty">👆 点击地图上的标记，或从下方卡片选择</div>';}
        refresh(false);openMgr();}
    });
    document.getElementById('mgrCopy').onclick=e=>{
      const t=document.getElementById('mgrJson');t.select();
      if(navigator.clipboard)navigator.clipboard.writeText(t.value).then(()=>{e.target.textContent='✓ 已复制'});
    };
    document.getElementById('mgrImport').onclick=()=>{
      try{
        const arr=JSON.parse(document.getElementById('mgrJson').value);
        if(!Array.isArray(arr))throw 0;
        arr.forEach(a=>{if(a&&a.name&&a.lat&&a.lng&&!P.some(x=>x.id===a.id)){
          a.custom=true;if(!a.id)a.id='u'+Date.now()+Math.random().toString(36).slice(2,5);
          if(!CAT[a.cat])a.cat='guozhi';P.push(a);customs.push(a);}});
        save(customs);refresh(false);openMgr();
      }catch(e){alert('导入失败：内容格式不对');}
    };
    document.getElementById('mgrClear').onclick=()=>{
      if(!confirm('确定清空所有自定义地点？'))return;
      customs.length=0;save(customs);
      for(let i=P.length-1;i>=0;i--)if(P[i].custom)P.splice(i,1);
      selectedId=null;refresh(false);mgrMask.classList.remove('show');
    };
    document.getElementById('mgrClose').onclick=()=>mgrMask.classList.remove('show');
  }
  window.openMgrGlobal=openMgr;
})();
</script>
</body>
